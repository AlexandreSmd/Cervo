# Intégration continue : à chaque push et pull request, qualité du code + tests + build,
# puis parcours de bout en bout dans un vrai navigateur (émulateurs Firebase, aucun compte requis).
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Qualité, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: astral-sh/setup-uv@v6
      - name: Cache des émulateurs Firebase
        uses: actions/cache@v4
        with: { path: ~/.cache/firebase/emulators, key: firebase-emulators-v1 }
      - run: npm ci
      - run: uv sync --project api
      - run: cp .env.example .env.local
      - run: npm run lint
      - run: npm run questions:check
      - run: npm test
      - run: npm run build --workspace web

  e2e:
    name: Parcours de bout en bout
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: astral-sh/setup-uv@v6
      - name: Cache des émulateurs Firebase
        uses: actions/cache@v4
        with: { path: ~/.cache/firebase/emulators, key: firebase-emulators-v1 }
      - run: npm ci
      - run: uv sync --project api
      - run: cp .env.example .env.local
      - run: npx --workspace web playwright install --with-deps chromium
      - run: npm run test:e2e
        env: { PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1" }
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-traces, path: web/test-results }
