  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta
      name="description"
      content="Garder son esprit affûté, vif et précis. 10 questions par jour, sans aide, et la preuve de ta progression."
    />
    <meta property="og:title" content="Vif — Garde ton esprit affûté, vif et précis." />
    <meta property="og:description" content="Dix questions par jour. Zéro IA. Un score honnête et ta progression dans le temps." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/og-image.svg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#F4F5F8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Réveille l'API pendant que le site se charge (gagne quelques secondes si le serveur dormait).
      fetch("/api/health", { cache: "no-store" }).catch(function () {});
    </script>
    <style>
      /* Écran affiché instantanément, avant le JavaScript (remplacé dès que l'appli démarre). */
      html,
      body {
        margin: 0;
        background: #f4f5f8;
      }
      @media (prefers-color-scheme: dark) {
        html,
        body {
          background: #000;
        }
        .splash {
          color: #f0f1f8;
        }
      }
      .splash {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        color: #111322;
        font:
          800 28px/1 system-ui,
          -apple-system,
          sans-serif;
        letter-spacing: -0.02em;
      }
      .splash i {
        display: inline-block;
        width: 11px;
        height: 11px;
        border-radius: 50%;
        margin-right: 3px;
        animation: splash 1s ease-in-out infinite alternate;
      }
      .splash i:nth-child(2) {
        animation-delay: 0.15s;
      }
      .splash i:nth-child(3) {
        animation-delay: 0.3s;
      }
      @keyframes splash {
        from {
          opacity: 0.35;
        }
        to {
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="splash" aria-label="Chargement de Vif">
        <span><i style="background: #5b4bff"></i><i style="background: #1fa971"></i><i style="background: #f2a33a"></i></span>Vif
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
