    <style>
      /* Écran affiché instantanément, avant le JavaScript (remplacé dès que l'appli démarre). */
      html,
      body {
        margin: 0;
        background: #f3efe6;
      }
      @media (prefers-color-scheme: dark) {

      .splash {

        font:

          sans-serif;
        letter-spacing: -0.02em;
      }
      .splash img {
        animation: splash 0.9s ease-in-out infinite alternate;
      }
      @keyframes splash {
        from {
          transform: scale(0.92);
        }
        to {
          transform: scale(1);
        }
      }
