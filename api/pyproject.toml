[project]
name = "cervo"
version = "0.1.0"
description = "API de Vif"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "firebase-admin>=6.5",
  "google-cloud-firestore>=2.16",
  "pydantic>=2.7",
  "python-dotenv>=1.0",
  "tzdata>=2024.1",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "httpx>=0.27",
  "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cervo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.uv]
package = true

[tool.ruff]
line-length = 140
target-version = "py312"
extend-exclude = [".venv"]

[tool.ruff.lint]
# Erreurs, imports, modernisation, bugs probables, simplifications.
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = [
  "RUF001", "RUF002", "RUF003",  # le code est en français : apostrophes et espaces typographiques voulus
  "B008",                        # Depends() en valeur par défaut : idiome FastAPI
  "SIM108",                      # les ternaires ne sont pas toujours plus lisibles
]

[tool.ruff.lint.isort]
known-first-party = ["cervo"]
