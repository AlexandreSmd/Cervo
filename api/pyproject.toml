[project]
name = "cervo"
version = "0.1.0"
description = "API de Cervo Daily"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "firebase-admin>=6.5",
  "google-cloud-firestore>=2.16",
  "pydantic>=2.7",
  "python-dotenv>=1.0",
  "tzdata>=2024.1",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cervo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.uv]
package = true
